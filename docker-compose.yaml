version: '3.8'

services:
  reverse-proxy:
    image: traefik:v3.0
    command:
      - "--configFile=/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "./traefik.yml:/traefik.yml"
      - "./logs/:/logs/"
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - proxy

  mahir-trade-db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: mahir-trade
      POSTGRES_USER: MahirTrade
      POSTGRES_PASSWORD: MahirTrade123-
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy

  mahir-trade-be:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    depends_on:
      - mahir-trade-db
    environment:
      PG_HOST: mahir-trade-db
      PG_PORT: "5432"
      PG_DBUSER: MahirTrade
      PG_DBPASS: MahirTrade123-
      PG_DBNAME: mahir-trade
    volumes:
      - ./service_account.json:/app/service_account.json
      - ~/.config/gcloud:/root/.config/gcloud
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mahir-trade-be.rule=Host(`api.mahirtrade.com`)"
      - "traefik.http.routers.mahir-trade-be.entrypoints=websecure"
      - "traefik.http.routers.mahir-trade-be.tls.certresolver=myresolver"
      - "traefik.http.services.mahir-trade-be.loadbalancer.server.port=8089"
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true

volumes:
  postgres_data:
    driver: local